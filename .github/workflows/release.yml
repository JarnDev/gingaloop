name: release
# Publishes to npm when a v* tag is pushed. Authentication is npm trusted publishing (GitHub OIDC):
# no npm token is stored anywhere, and the package gets a provenance statement linking it to this
# workflow run and commit. One-time setup on npmjs.com: package settings → Trusted publisher →
# GitHub Actions, repository JarnDev/gingaloop, workflow release.yml.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - run: npm run check:examples
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never restore a cache into the job that publishes
      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: npm with trusted publishing (11.5.1+)
        run: npm install -g npm@^11.5.1
      - run: npm publish --provenance --access public

name: release
# Publishes to npm when a v* tag is pushed. Authentication is npm trusted publishing (GitHub OIDC):
# no npm token is stored anywhere, and the package gets a provenance statement linking it to this
# workflow run and commit. One-time setup on npmjs.com: package settings → Trusted publisher →
# GitHub Actions, repository JarnDev/gingaloop, workflow release.yml.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - run: npm run check:examples
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never restore a cache into the job that publishes
      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: npm with trusted publishing (11.5.1+)
        run: npm install -g npm@^11.5.1
      - run: npm publish --provenance --access public
  github-release:
    # Its own job, so the only job with write access to the repo runs no npm code.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "**Install:** \`npm install -g gingaloop\`, then \`ginga init ~/gingaloop\`."
            echo
            echo "## What's new in $version"
            awk -v v="$version" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {if (f) exit} f' CHANGELOG.md
          } > notes.md
          grep -q '^- ' notes.md || { echo "No CHANGELOG section for $version" >&2; exit 1; }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "gingaloop ${GITHUB_REF_NAME#v}" --notes-file notes.md --latest
